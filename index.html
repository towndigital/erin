  <style>
    :root {
      --background: #f7f6f2;
      --text: #111111;
      --muted: #686868;
      --accent: #2457ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 1100px;
      height: 100vh;
      height: 100svh;
      margin: 0 auto;
      padding: 48px;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .content {
      align-self: center;
      max-width: 900px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(64px, 10vw, 140px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      font-weight: 700;
    }

    .intro {
      margin: 0;
      max-width: 820px;
      font-size: clamp(26px, 3.8vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .intro + .intro { margin-top: 28px; }
    .secondary { color: var(--muted); }

    .secondary a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .secondary a:hover { color: var(--text); }

    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      font-size: 15px;
    }

    .linkedin {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
    }

    .linkedin:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .fine-print { color: var(--muted); }

    @media (max-width: 640px) {
      main { padding: 24px 20px; }

      h1 {
        margin-bottom: 22px;
        font-size: clamp(52px, 17vw, 76px);
        line-height: 0.9;
      }

      .intro {
        font-size: clamp(23px, 7vw, 28px);
        line-height: 1.12;
      }

      .intro + .intro { margin-top: 20px; }
      footer { gap: 10px; font-size: 13px; }
      .linkedin { font-size: 16px; }
    }

    @media (max-height: 650px) {
      main { padding-top: 20px; padding-bottom: 20px; }
      h1 { font-size: clamp(48px, 11vh, 82px); margin-bottom: 18px; }
      .intro { font-size: clamp(20px, 4.5vh, 30px); }
      .intro + .intro { margin-top: 16px; }
    }
  </style>
